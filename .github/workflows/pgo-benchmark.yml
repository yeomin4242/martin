name: PGO and BOLT benchmark

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture to measure
        type: choice
        options: [both, x86_64, aarch64]
        default: both
      optimization:
        description: Optimization to compare with the release baseline
        type: choice
        options: [pgo, pgo-bolt]
        default: pgo

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.architecture == 'x86_64' && '["ubuntu-24.04"]' || inputs.architecture == 'aarch64' && '["ubuntu-24.04-arm"]' || '["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    services:
      postgres:
        image: ghcr.io/baosystems/postgis:18-3.6@sha256:8784f86b3e0e046859c96ea25eb8b10f0b801fd891b99a82b82f28ac4a643db8
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432/tcp]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Record measurement host
        run: |
          mkdir -p target
          { lscpu; free -h; uname -a; } > target/pgo-host.txt
      - name: Free disk space for profiling builds
        uses: BRAINSia/free-disk-space@7048ffbf50819342ac964ef3998a51c2564a8a75 # v2.1.3
        with:
          tool-cache: false
          mandb: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true
      - name: Initialize database
        env:
          PGDATABASE: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: tests/fixtures/initdb.sh
      - name: Test benchmark harness
        run: python3 -m unittest discover -s tests/bench -p 'test_pgo.py'
      - name: Build experiment environment
        run: docker build -f .github/files/pgo.Dockerfile -t martin-pgo .
      - name: Build, profile and compare
        env:
          # Keep general ARM artifacts compatible with Cortex-A53.
          OPTIMIZATION: ${{ runner.arch == 'ARM64' && 'pgo' || inputs.optimization }}
          PGO_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/test
        run: |
          docker run --rm --network host \
            -v "$PWD:/work" -e PGO_DATABASE_URL \
            martin-pgo build --optimization "$OPTIMIZATION" \
            --output target/pgo-experiment --compare
      - name: Save measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgo-${{ runner.arch }}-${{ runner.arch == 'ARM64' && 'pgo' || inputs.optimization }}
          path: |
            target/pgo-host.txt
            target/pgo-experiment/build.json
            target/pgo-experiment/identity.json
            target/pgo-experiment/timings.json
            target/pgo-experiment/*.log
            target/pgo-experiment/benchmark/
            target/pgo-experiment/training/
            target/pgo-experiment/bolt-training/
            target/pgo-experiment/smoke/
            target/pgo-experiment/martin
          retention-days: 7
