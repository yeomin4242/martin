name: Validate actual PGO build workflow
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    uses: $/.github/workflows/build-binary.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      release_mode: true
      pgo: true
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build-${{ matrix.target }}
          path: target_releases/${{ matrix.platform }}/
      - name: Run actual base Docker image without freetype
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          chmod +x "target_releases/$PLATFORM/"*
          docker build --build-arg TARGETPLATFORM="$PLATFORM" -f .github/files/multi-platform.Dockerfile -t martin-ci-smoke .
          if docker run --rm --entrypoint dpkg-query martin-ci-smoke -W libfreetype6; then
            echo 'Unexpected libfreetype6 in base image'
            exit 1
          fi
          docker run --rm martin-ci-smoke --version
          docker run --rm --entrypoint /usr/local/bin/mbtiles martin-ci-smoke --version
          container=$(docker run -d --net host -v "$PWD/tests/fixtures:/fixtures:ro" martin-ci-smoke --cache-size 0 --workers 2 /fixtures/pmtiles/png.pmtiles /fixtures/geojson/feature_collection_1.geojson)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health
          curl -fsS http://localhost:3000/catalog
          for path in png/0/0/0 feature_collection_1/0/0/0; do
            curl -fsS "http://localhost:3000/$path" -o /tmp/tile
            test -s /tmp/tile
            sha256sum /tmp/tile
          done
