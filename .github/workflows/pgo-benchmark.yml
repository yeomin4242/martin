name: Validate PGO installer recipe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - run: rustup update stable && rustup default stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with: { tool: just@1.58.0 }
      - name: Execute the actual CI installer command twice
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, subprocess
          lines = Path('.github/workflows/build-binary.yml').read_text().splitlines()
          start = lines.index('      - name: Install cargo-pgo and LLVM tooling')
          end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('      - '))
          line = next(x for x in lines[start:end] if x.startswith('        run: '))
          command = line[len('        run: '):]
          assert command == 'just pgo-install "$TARGET"'
          for attempt in range(2):
              print(f'Installer invocation {attempt + 1}: {command}', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', command], check=True)
          PYCODE
      - name: Verify installed tooling and target-specific BOLT
        run: |
          set -euo pipefail
          cargo pgo --version
          sqlite3 --version
          psql --version
          llvm_profdata="$(rustc --print sysroot)/lib/rustlib/$TARGET/bin/llvm-profdata"
          test -x "$llvm_profdata"
          "$llvm_profdata" --version
          if [[ "$TARGET" == x86_64-unknown-linux-gnu ]]; then
            llvm_major=$(rustc -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')
            test "$(readlink /usr/local/bin/llvm-bolt)" = "/usr/bin/llvm-bolt-$llvm_major"
            test "$(readlink /usr/local/bin/merge-fdata)" = "/usr/bin/merge-fdata-$llvm_major"
            test "$(readlink /usr/local/lib/libbolt_rt_instr.a)" = "/usr/lib/llvm-$llvm_major/lib/libbolt_rt_instr.a"
            test -f /usr/local/lib/libbolt_rt_instr.a
            llvm-bolt --version
            merge-fdata --help
          else
            test ! -L /usr/local/bin/llvm-bolt
          fi
