name: PGO and BOLT benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      SOURCE_SHA: c63cfce5380f6140dd77bc4768ddad987b495afe
      TARGET: ${{ matrix.target }}
      RELEASE_MODE: '1'
      LEGACY_CPU: ''
      CARGO_BUILD_JOBS: '4'
      CARGO_TARGET_DIR: target/ci-rerun/build
    services:
      postgres:
        image: ghcr.io/baosystems/postgis:18-3.6@sha256:8784f86b3e0e046859c96ea25eb8b10f0b801fd891b99a82b82f28ac4a643db8
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432/tcp]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Save measurement tools outside source checkout
        run: |
          cp .github/files/ci-pgo-rerun.py "$RUNNER_TEMP/ci-pgo-rerun.py"
          cp .github/files/ci-pgo-measure.py "$RUNNER_TEMP/ci-measure.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Free disk space for profiling builds
        uses: BRAINSia/free-disk-space@7048ffbf50819342ac964ef3998a51c2564a8a75
        with:
          tool-cache: false
          mandb: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true
      - name: Install existing benchmark tools
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with: { tool: 'just@1.58.0,oha@1.16.0' }
      - run: rustup update stable && rustup default stable
      - name: Record host and extract unchanged CI steps
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/test
        run: |
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          python3 "$RUNNER_TEMP/ci-pgo-rerun.py" prepare
          { lscpu; free -h; uname -a; } > target/ci-rerun/host.txt
      - name: Install tooling using the PR CI step
        run: python3 "$RUNNER_TEMP/ci-pgo-rerun.py" install
      - name: Initialize profiling database
        env:
          PGDATABASE: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: tests/fixtures/initdb.sh
      - name: Build normal release baseline
        run: python3 "$RUNNER_TEMP/ci-pgo-rerun.py" baseline
      - name: Execute the PR optimized CI step unchanged
        run: python3 "$RUNNER_TEMP/ci-pgo-rerun.py" optimized
      - name: Compare shipped binaries with five alternating repetitions
        run: python3 "$RUNNER_TEMP/ci-pgo-rerun.py" measure
      - name: Save results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-rerun-${{ matrix.target }}
          path: |
            target/ci-rerun/*.json
            target/ci-rerun/*.txt
            target/ci-rerun/*.sh
            target/ci-rerun/*.log
            target/ci-rerun/benchmark/
            target/ci-rerun/baseline/martin
            target/ci-rerun/optimized/martin
            target/ci-rerun/build/pgo-training.log
          retention-days: 7
