name: Build Binary

on:
  workflow_call:
    inputs:
      target:
        description: 'Build target triple'
        required: true
        type: string
      os:
        description: 'Runner OS label'
        required: true
        type: string
      musl:
        description: 'Use cargo-zigbuild / zig for a musl static build'
        required: false
        type: boolean
        default: false
      full:
        description: 'Build the batteries-included `-full` variant (adds the rendering feature). Linux gnu only.'
        required: false
        type: boolean
        default: false
      legacy_cpu:
        description: 'Build for the baseline x86-64 CPU level instead of x86-64-v3. Only affects x86_64 targets.'
        required: false
        type: boolean
        default: false
      release_mode:
        description: 'Build in release mode with debug info stripped. Set to false for PR builds to reduce build time.'
        required: false
        type: boolean
        default: true
      optimization:
        description: 'none, pgo or pgo-bolt. Native Linux GNU base release builds only.'
        required: false
        type: string
        default: none

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.optimization != 'none' && 180 || 90 }}
    permissions:
      contents: read
    env:
      # Set RELEASE_MODE to '1' for release builds (push to main, releases, and manual workflow dispatches),
      # or empty for PR debug builds to reduce CI build time.
      RELEASE_MODE: ${{ inputs.release_mode && '1' || '' }}
      LEGACY_CPU: ${{ inputs.legacy_cpu && '1' || '' }}
    services:
      postgres:
        # Upstream postgis/postgis has no ARM image. Use its multiarch rebuild
        # for native ARM profiling, rather than profiling under QEMU.
        image: ${{ inputs.optimization != 'none' && endsWith(inputs.target, '-unknown-linux-gnu') && 'ghcr.io/baosystems/postgis:18-3.6@sha256:8784f86b3e0e046859c96ea25eb8b10f0b801fd891b99a82b82f28ac4a643db8' || '' }}
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432/tcp]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - run: rustup update stable && rustup default stable
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install just (and cargo-zigbuild for musl)
        uses: $/.github/actions/setup-rust
        with:
          toolchain: none
          tools: ${{ inputs.musl && 'just,cargo-zigbuild' || 'just' }}
      - name: Install zig (musl only)
        if: inputs.musl
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with: { version: '0.15.1', use-cache: false }
      - name: Rust Versions
        run: rustc --version && cargo --version
      - name: Validate optimization configuration
        env:
          OPTIMIZATION: ${{ inputs.optimization }}
          TARGET: ${{ inputs.target }}
          SUPPORTED: ${{ runner.os == 'Linux' && !inputs.musl && !inputs.full && inputs.release_mode && endsWith(inputs.target, '-unknown-linux-gnu') }}
        run: |
          case "$OPTIMIZATION" in
            none) ;;
            pgo|pgo-bolt) test "$SUPPORTED" = true ;;
            *) echo "Unsupported optimization: $OPTIMIZATION" >&2; exit 1 ;;
          esac
          if [[ "$OPTIMIZATION" == pgo-bolt && "$TARGET" != x86_64-* ]]; then
            echo 'General ARM releases support PGO only: BOLT cannot preserve Cortex-A53 veneers' >&2
            exit 1
          fi
      - name: Free disk space for profiling builds
        if: inputs.optimization != 'none'
        uses: BRAINSia/free-disk-space@7048ffbf50819342ac964ef3998a51c2564a8a75 # v2.1.3
        with:
          tool-cache: false
          mandb: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true
      - name: Install PGO tooling
        if: inputs.optimization != 'none'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with: { tool: oha@1.16.0 }
      - name: Install cargo-pgo and LLVM tooling
        if: inputs.optimization != 'none'
        env:
          OPTIMIZATION: ${{ inputs.optimization }}
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-pgo --version 0.3.0 --locked
          if [[ "$OPTIMIZATION" == pgo-bolt ]]; then
            llvm_major=$(rustc -vV | sed -nE 's/^LLVM version: ([0-9]+).*/\1/p')
            sudo bash .github/files/install-bolt.sh "$llvm_major"
          fi
      - name: Initialize profiling database
        if: inputs.optimization != 'none'
        env:
          PGDATABASE: test
          PGUSER: postgres
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
        run: tests/fixtures/initdb.sh
      - name: Install NASM for rustls/aws-lc-rs on Windows
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Install rendering dependencies
        if: runner.os == 'Linux' && inputs.full
        run: just install-dependencies

      - name: Build ${{ inputs.target }}
        if: ${{ !inputs.musl && !inputs.full && inputs.optimization == 'none' }}
        env:
          TARGET: ${{ inputs.target }}
        run: just build-release "$TARGET"
      - name: Build optimized ${{ inputs.target }}
        if: inputs.optimization != 'none'
        env:
          TARGET: ${{ inputs.target }}
          OPTIMIZATION: ${{ inputs.optimization }}
          PGO_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/test
        run: just build-release-pgo "$TARGET" "$OPTIMIZATION"
      - name: Build ${{ inputs.target }} (full)
        if: ${{ inputs.full }}
        env:
          TARGET: ${{ inputs.target }}
        run: just build-release-full "$TARGET"
      - name: Build ${{ inputs.target }} (musl)
        if: inputs.musl
        env:
          TARGET: ${{ inputs.target }}
        run: just build-release-musl "$TARGET"
      - name: Move ${{ inputs.target }} artefacts to the target_releases directory
        env:
          TARGET: ${{ inputs.target }}
        run: just move-artifacts "$TARGET"

      - name: Save build artifacts to build-${{ inputs.target }}${{ inputs.full && '-full' || '' }}${{ inputs.legacy_cpu && '-legacycpu' || '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ inputs.target }}${{ inputs.full && '-full' || '' }}${{ inputs.legacy_cpu && '-legacycpu' || '' }}
          path: target_releases/
